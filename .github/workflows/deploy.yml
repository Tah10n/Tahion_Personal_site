name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_ANALYTICS_PROVIDER: ${{ vars.VITE_ANALYTICS_PROVIDER }}
      VITE_ANALYTICS_SCRIPT_URL: ${{ vars.VITE_ANALYTICS_SCRIPT_URL }}
      VITE_ANALYTICS_SITE_ID: ${{ vars.VITE_ANALYTICS_SITE_ID }}
      VITE_ANALYTICS_DASHBOARD_URL: ${{ vars.VITE_ANALYTICS_DASHBOARD_URL }}
      VITE_ANALYTICS_PUBLIC_STATS_URL: ${{ vars.VITE_ANALYTICS_PUBLIC_STATS_URL }}
      VITE_ANALYTICS_TRACK_PAGEVIEWS: ${{ vars.VITE_ANALYTICS_TRACK_PAGEVIEWS }}
      VITE_GIT_SHA: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check and build
        run: npm run check
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
